[project]
name = "endfield-packbuilder"
version = "0.1.0"
description = "Build the Endfield Game Pack from Enka and preserved upstream hash data."
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0,<13"]

[project.scripts]
packbuilder = "packbuilder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packbuilder"]
